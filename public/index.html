      <h2 class="poem-title">Wanderer</h2>
      <div class="poem-meta">October 2026 • Latest Entry</div>
      <div class="poem-body">
        The streetlights hum in silent streets,
        A shadow bends where city meets
        The cold gray rain of autumn night,
        And shifts beneath the fading light.
      </div>
